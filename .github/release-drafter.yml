categories:
  - title: '⚠️ Breaking changes'
    when:
      label: 'BREAKING CHANGES'

  - title: '🚀 Features'
    when:
      label: 'feature'

  - title: '🛠 Refactor'
    when:
      label: 'refactor'

  - title: '🐛 Bug Fixes'
    when:
      label: 'fix'

  - title: '💅 Style'
    when:
      label: 'style'

  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'dependencies'
        - 'ci'

  - title: '📚 Documentation'
    when:
      label: 'documentation'

  - title: '🧪 Tests'
    when:
      label: 'tests'

  - title: '🏎 Optimizations'
    when:
      label: 'optimizations'

  - type: version-resolver
    semver-increment: major
    when:
      labels:
        - 'BREAKING CHANGES'
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - 'feature'
        - 'enhancement'
        - 'dependencies'
  - type: version-resolver
    semver-increment: patch
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
        - 'optimizations'
        - 'refactor'
        - 'style'
  - type: version-resolver
    semver-increment: patch

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

change-template: '- $TITLE #$NUMBER (@$AUTHOR)'
template: |
  $CHANGES