name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ymshenyu/nestjs-zod build
      - run: pnpm --filter @ymshenyu/nestjs-zod test
      - run: pnpm --filter @ymshenyu/nestjs-zod test:package
      - run: pnpm --filter @ymshenyu/nestjs-zod typecheck
      - name: Set version and copy docs
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter a version such as 1.0.0"
            exit 1
          fi
          cp README.md LICENSE packages/nestjs-zod/
          cd packages/nestjs-zod
          npm version "$RELEASE_VERSION" --allow-same-version --no-git-tag-version --ignore-scripts
      - name: Publish to npm
        working-directory: packages/nestjs-zod
        env:
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: |
          if [[ -n "$NPM_STAGE_TOKEN" ]]; then
            NODE_AUTH_TOKEN="$NPM_STAGE_TOKEN" npm stage publish --access public
          else
            npm publish --access public
          fi
