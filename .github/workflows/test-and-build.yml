name: Test and Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ymshenyu/nestjs-zod build
      - run: pnpm --filter @ymshenyu/nestjs-zod test
      - run: pnpm --filter @ymshenyu/nestjs-zod typecheck
      - run: pnpm --filter @ymshenyu/nestjs-zod lint
      - run: pnpm --filter @ymshenyu/nestjs-zod format:check
      - run: pnpm --filter example-star-wars build
      - run: pnpm --filter example-star-wars test
      - run: pnpm --filter example-swc build
