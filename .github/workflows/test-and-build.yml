name: Test and Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ymshenyu/nestjs-zod build
      - run: pnpm --filter @ymshenyu/nestjs-zod test
      - run: pnpm --filter @ymshenyu/nestjs-zod test:package
      - run: pnpm --filter @ymshenyu/nestjs-zod typecheck
      - run: pnpm --filter @ymshenyu/nestjs-zod lint
      - run: pnpm --filter @ymshenyu/nestjs-zod format:check
